# Dega Core config for claude-code-config repo
version: 1
max_iterations: 3

budget:
  warn_at_iteration: 2
check_command: bash scripts/ralph-check.sh
poll_interval_seconds: 30

# Legacy worker and reviewer prompt templates (used by scripts/ralph-loop.sh — use orchestrator instead)
worker_prompt: scripts/ralph-worker-prompt.md
reviewer_prompt: scripts/ralph-reviewer-prompt.md

github:
  sync: true
  repo: DEGAorg/claude-code-config
  labels: true
  comments: true
  close_on_ship: true
  pr_target: ace-work

timeline:
  repo: DEGAorg/claude-code-config
  branch: develop
  path: data/timeline.json

success_criteria: []
