name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-hooks:
    name: Lint hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Run shellcheck on all scripts
        run: shellcheck -e SC1091 -S warning hooks/*.sh scripts/*.sh tests/*.sh
      - name: Install shfmt v3.12.0
        run: |
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: Check shell script formatting
        run: shfmt -i 2 -d hooks/*.sh scripts/*.sh tests/*.sh

  test-hooks:
    name: Test hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Test enforce-package-manager hook
        run: bash tests/test-enforce-package-manager.sh
